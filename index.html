<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>購入者特典 | brain_bonus-portal</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 0; background: #f6f7f9; color: #1c1e21; }
  header { background: #fff; border-bottom: 1px solid #e2e4e8; padding: 24px 16px 16px; text-align: center; }
  header h1 { font-size: 20px; margin: 0 0 8px; }
  header p { font-size: 13px; color: #5a6068; margin: 0; }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  section.sku { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  section.sku h2 { font-size: 16px; margin: 0 0 4px; }
  section.sku .slug { font-size: 12px; color: #8a9099; font-family: monospace; }
  .gate { display: flex; gap: 8px; margin-top: 14px; }
  .gate input { flex: 1; padding: 9px 12px; border: 1px solid #c8ccd2; border-radius: 8px; font-size: 14px; }
  .gate button { padding: 9px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  .gate button:hover { background: #1d4fd8; }
  .msg { font-size: 13px; margin-top: 8px; color: #b4231f; }
  .msg.ok { color: #1a7f37; }
  ul.items { margin: 14px 0 0; padding: 0; list-style: none; }
  ul.items li { padding: 10px 12px; border-top: 1px solid #eef0f2; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; }
  ul.items li .name { font-weight: 600; }
  ul.items li .desc { color: #5a6068; font-weight: 400; }
  ul.items li a { color: #2563eb; text-decoration: none; white-space: nowrap; }
  ul.items li a:hover { text-decoration: underline; }
  .pending { color: #8a9099; font-size: 12px; white-space: nowrap; }
  footer { text-align: center; font-size: 12px; color: #8a9099; padding: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>購入者特典</h1>
  <p>Brainでご購入いただいた商品の特典を受け取れるページです。キーは商品に添付の「特典受取案内」に記載されています。</p>
</header>
<main id="app"></main>
<footer>本ページは Brain 販売商品の購入者向け特典配布用です。特典は購入者ご本人の利用に限ります（再配布・転載不可）。キーがわからない場合はお買い上げ商品の添付ファイルをご確認ください。</footer>
<script>
const SKUS = [
  {
    id: "012-hire-today",
    title: "SKU 012 hire-today",
    enc: {
      salt: "chrdguM9fpz8glKsRArchw==",
      iv: "oC22dkXLcFBwVQdX",
      data: "WabWnaea0qV9BxE4aShEugIQT4NEYy3nStTnBRUUeXhBg3h0zEoKyenu7UqLHtKoqt1qq6XUQBfJST0wyzYlYQLDhFVERKDXsNofVTm8nBRzGU2kTRpdxNx4zrGshkjOB4f5uywRIc1agacQy+azMPUhP8wwEwoH1qfXL072BLpYNOLcYCNq8JQ7pAaBn+cfmaiFonRtmVNVnuCKClpUQf4jMHINSBx+XPgsyh918U0sfZsgOt4Vkz24RRrZx7XNS8mYT9Jz21zEhIVLXIm9EWI="
    }
  }
];

async function decryptItems(enc, key) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(key), "PBKDF2", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: 120000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, aes, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function itemRow(it) {
  const name = `<span><span class="name">${it.name}</span> <span class="desc">— ${it.desc}</span></span>`;
  if (it.status === "準備中") return `<li>${name}<span class="pending">準備中</span></li>`;
  return `<li>${name}<a href="${it.url}" download>ダウンロード</a></li>`;
}

function render() {
  document.getElementById("app").innerHTML = SKUS.map((s, i) => `
    <section class="sku" id="sku-${i}">
      <h2>${s.title}</h2><span class="slug">${s.id}</span>
      <div class="gate">
        <input type="text" placeholder="特典キーを入力" aria-label="特典キー">
        <button type="button">解錠</button>
      </div>
      <p class="msg" hidden></p>
      <ul class="items hidden"></ul>
    </section>`).join("");

  SKUS.forEach((s, i) => {
    const sec = document.getElementById(`sku-${i}`);
    const msg = sec.querySelector(".msg");
    const act = async () => {
      let items;
      try {
        items = await decryptItems(s.enc, sec.querySelector("input").value.trim());
      } catch {
        msg.textContent = "キーが違います。商品の添付「特典受取案内」をご確認ください。";
        msg.className = "msg";
        msg.hidden = false;
        return;
      }
      const ul = sec.querySelector(".items");
      ul.innerHTML = items.map(itemRow).join("");
      ul.classList.remove("hidden");
      sec.querySelector(".gate").classList.add("hidden");
      msg.textContent = "解錠しました。特典一覧を表示しています。";
      msg.className = "msg ok";
      msg.hidden = false;
    };
    sec.querySelector("button").addEventListener("click", act);
    sec.querySelector("input").addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
  });
}
render();
</script>
</body>
</html>
