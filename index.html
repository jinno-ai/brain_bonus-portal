async function decryptItems(enc, key) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(key), "PBKDF2", false, ["deriveKey"]);
  let lastError;
  for (const variant of Array.isArray(enc) ? enc : [enc]) {
    try {
      const aes = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(variant.salt), iterations: 120000, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(variant.iv) }, aes, b64(variant.data));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch (error) {
      if (error.name !== "OperationError") throw error;
      lastError = error;
    }
  }
  throw lastError || new Error("No encrypted content available");
}

function itemRow(it) {
  const li = document.createElement("li");
  const heading = document.createElement("div");
  heading.className = "item-heading";
  const label = document.createElement("span");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = it.name;
  const desc = document.createElement("span");
  desc.className = "desc";
  desc.textContent = ` — ${it.desc}`;
  label.append(name, desc);
  heading.append(label);
  li.append(heading);

  if (it.status === "準備中") {
    const status = document.createElement("span");
    status.className = "pending";
    status.textContent = "準備中";
    heading.append(status);
    return li;
  }
  if (typeof it.content === "string") {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "内容を読む";
    const body = document.createElement("div");
    body.className = "content-body";
    body.textContent = it.content;
    details.append(summary, body);
    li.append(details);
    return li;
  }
  if (typeof it.url === "string") {
    try {
      const url = new URL(it.url, window.location.href);
      if (url.protocol === "https:" || url.origin === window.location.origin) {
        const link = document.createElement("a");
        link.href = url.href;
        link.download = "";
        link.textContent = "ダウンロード";
        heading.append(link);
      }
    } catch {
      // Ignore malformed bonus links.
    }
  }
  return li;
}

function render() {
  const app = document.getElementById("app");
  app.replaceChildren();

  SKUS.forEach((s, i) => {
    const card = document.createElement("section");
    card.className = "sku";
    card.id = `sku-${i}`;

    const title = document.createElement("h2");
    title.textContent = s.title;

    const gate = document.createElement("div");
    gate.className = "gate";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "特典キーを入力";
    input.setAttribute("aria-label", "特典キー");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "解錠";
    gate.append(input, button);

    const message = document.createElement("p");
    message.className = "msg";
    message.hidden = true;
    const list = document.createElement("ul");
    list.className = "items hidden";

    card.append(title, gate, message, list);
    app.append(card);
  });

  SKUS.forEach((s, i) => {
    const card = document.getElementById(`sku-${i}`);
    const msg = card.querySelector(".msg");
    const act = async () => {
      let items;
      try {
        items = await decryptItems(s.enc, card.querySelector("input").value.trim());
      } catch {
        msg.textContent = "キーが違います。Brain記事の有料エリアにある受取案内をご確認ください。";
        msg.className = "msg";
        msg.hidden = false;
        return;
      }
      const ul = card.querySelector(".items");
      ul.replaceChildren(...items.map(itemRow));
      ul.classList.remove("hidden");
      card.querySelector(".gate").classList.add("hidden");
      msg.textContent = "解錠しました。特典一覧を表示しています。";
      msg.className = "msg ok";
      msg.hidden = false;
    };
    card.querySelector("button").addEventListener("click", act);
    card.querySelector("input").addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
  });
}
render();
</script>
