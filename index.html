<style>

  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 0; background: #f6f7f9; color: #1c1e21; }

  header h1 { font-size: 20px; margin: 0 0 8px; }
  header p { font-size: 13px; color: #5a6068; margin: 0; }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  section.sku { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  section.sku h2 { font-size: 16px; margin: 0 0 4px; }
  .gate { display: flex; gap: 8px; margin-top: 14px; }
  .gate input { flex: 1; padding: 9px 12px; border: 1px solid #c8ccd2; border-radius: 8px; font-size: 14px; }
  .gate button { padding: 9px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }

  ul.items li .name { font-weight: 600; }
  ul.items li .desc { color: #5a6068; font-weight: 400; }
  ul.items li a { color: #2563eb; text-decoration: none; white-space: nowrap; }
  ul.items li a:hover { text-decoration: underline; }
  ul.items li details { margin-top: 8px; }
  ul.items li summary { color: #2563eb; cursor: pointer; }
  .content-body { margin-top: 8px; padding: 12px; border-radius: 8px; background: #f6f7f9; white-space: pre-wrap; line-height: 1.75; }
  .pending { color: #8a9099; font-size: 12px; white-space: nowrap; }
  footer { text-align: center; font-size: 12px; color: #8a9099; padding: 16px; }
  .hidden { display: none; }

async function decryptItems(enc, key) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(key), "PBKDF2", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: 120000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, aes, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function itemRow(it) {
  const li = document.createElement("li");
  const heading = document.createElement("div");
  heading.className = "item-heading";
  const label = document.createElement("span");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = it.name;
  const desc = document.createElement("span");
  desc.className = "desc";
  desc.textContent = ` — ${it.desc}`;
  label.append(name, desc);
  heading.append(label);
  li.append(heading);

  if (it.status === "準備中") {
    const status = document.createElement("span");
    status.className = "pending";
    status.textContent = "準備中";
    heading.append(status);
    return li;
  }
  if (typeof it.content === "string") {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "内容を読む";
    const body = document.createElement("div");
    body.className = "content-body";
    body.textContent = it.content;
    details.append(summary, body);
    li.append(details);
    return li;
  }
  if (typeof it.url === "string") {
    try {
      const url = new URL(it.url, window.location.href);
      if (url.protocol === "https:" || url.origin === window.location.origin) {
        const link = document.createElement("a");
        link.href = url.href;
        link.download = "";
        link.textContent = "ダウンロード";
        heading.append(link);
      }
    } catch {
      // Ignore malformed bonus links.
    }
  }
  return li;
}

function render() {
  const app = document.getElementById("app");
  app.replaceChildren();

  SKUS.forEach((s, i) => {
    const card = document.createElement("section");
    card.className = "sku";
    card.id = `sku-${i}`;

    const title = document.createElement("h2");
    title.textContent = s.title;

    const gate = document.createElement("div");
    gate.className = "gate";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "特典キーを入力";
    input.setAttribute("aria-label", "特典キー");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "解錠";
    gate.append(input, button);

    const message = document.createElement("p");
    message.className = "msg";
    message.hidden = true;
    const list = document.createElement("ul");
    list.className = "items hidden";

    card.append(title, gate, message, list);
    app.append(card);
  });

  SKUS.forEach((s, i) => {
    const card = document.getElementById(`sku-${i}`);
    const msg = card.querySelector(".msg");
    const act = async () => {
      let items;
      try {
        items = await decryptItems(s.enc, card.querySelector("input").value.trim());
      } catch {
        msg.textContent = "キーが違います。Brain記事の有料エリアにある受取案内をご確認ください。";
        msg.className = "msg";
        msg.hidden = false;
        return;
      }
      const ul = card.querySelector(".items");
      ul.replaceChildren(...items.map(itemRow));
      ul.classList.remove("hidden");
      card.querySelector(".gate").classList.add("hidden");
      msg.textContent = "解錠しました。特典一覧を表示しています。";
      msg.className = "msg ok";
      msg.hidden = false;
    };
    card.querySelector("button").addEventListener("click", act);
    card.querySelector("input").addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
  });
}
render();
