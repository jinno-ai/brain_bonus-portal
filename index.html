<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>購入者特典ポータル</title>
<style>
:root{color-scheme:light;--bg:#f7f5f2;--ink:#1a1a2e;--muted:#6b6258;--line:#eadfd4;--card:#fff;--accent:#ea580c;--accent2:#c2410c;--ok:#16794c;--err:#b4231f;--soft:#fff7ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.65}a{color:var(--accent2)}button,input{font:inherit}
.hero{padding:34px 16px 22px;background:linear-gradient(145deg,#fff7ed,#fff 70%);border-bottom:1px solid var(--line)}
.hero-inner{max-width:820px;margin:0 auto}.eyebrow{display:inline-block;background:#ffedd5;color:#9a3412;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.hero h1{font-size:28px;line-height:1.35;margin:12px 0 8px}.hero p{margin:0;color:var(--muted);font-size:15px}
main{max-width:820px;margin:0 auto;padding:20px 16px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000008}.sku-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.sku-head h2{font-size:20px;line-height:1.4;margin:0}.slug{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-all}.pill{flex:0 0 auto;border-radius:999px;background:#f1f5f9;color:#475569;padding:4px 9px;font-size:12px;font-weight:700}.lead{color:var(--muted);font-size:14px;margin:8px 0 0}
.gate{margin-top:14px;display:flex;gap:8px}.gate input{min-width:0;flex:1;border:1px solid #d6c9bc;border-radius:12px;padding:11px 12px;background:#fff}.btn{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:var(--accent2)}.btn.secondary{background:#fff;color:var(--accent2);border:1px solid #fdba74}.btn.quiet{background:#f5f5f4;color:#44403c;border:1px solid #e7e5e4}.btn:disabled{opacity:.55;cursor:wait}.msg{font-size:13px;margin:10px 0 0;color:var(--err)}.msg.ok{color:var(--ok)}
.items{display:grid;gap:12px;margin-top:14px}.item{border:1px solid #eee2d8;border-radius:14px;padding:14px;background:#fffdf9}.item-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.item h3{font-size:16px;line-height:1.45;margin:0}.desc{color:var(--muted);font-size:13px;margin:5px 0 0}.tag{white-space:nowrap;border-radius:999px;background:#eef2ff;color:#4338ca;padding:3px 8px;font-size:11px;font-weight:700}.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.member-box,.review-box,.next-box,.note-box{border-radius:14px;padding:13px;margin-top:12px;font-size:14px}.member-box{background:#eef2ff;border:1px solid #c7d2fe}.review-box{background:#f0fdf4;border:1px solid #bbf7d0}.next-box{background:#fff7ed;border:1px solid #fed7aa}.note-box{background:#fafaf9;border:1px solid #e7e5e4;color:var(--muted)}.confirm{margin-top:10px;padding-top:10px;border-top:1px dashed #c7d2fe}.asset-viewer{margin-top:12px}.asset-viewer iframe{display:block;width:100%;height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}.viewerbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}.small{font-size:12px;color:var(--muted)}.loading{padding:28px;text-align:center;color:var(--muted)}footer{padding:20px 16px 32px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}
@media(max-width:560px){.hero h1{font-size:24px}.gate{flex-direction:column}.gate .btn{width:100%}.sku-head,.item-top{display:block}.pill,.tag{display:inline-block;margin-top:8px}.item-actions .btn{width:100%;text-align:center}.card{padding:15px;border-radius:15px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
<span class="eyebrow">購入者限定</span>
<h1>特典の受け取りは、リンクを開くだけです</h1>
<p>購入時の案内リンクから開くと、鍵の入力なしで特典が表示されます。直接開いた場合だけ、商品ごとの特典キーを入力してください。</p>
</div></header>
<main id="app"><div class="loading">読み込み中…</div></main>
<footer>特典は購入者ご本人の利用に限ります。再配布・転載はご遠慮ください。鍵が分からない場合は、購入した商品ページの購入者向け案内をご確認ください。</footer>
<script>
const app = document.getElementById('app');
const enc = new TextEncoder();
const dec = new TextDecoder();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let skus = [];

async function deriveAes(encObj, key, usages) {
  const base = await crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(encObj.salt), iterations:120000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, usages);
}
async function decryptBytes(encObj, key) {
  let lastError;
  for (const variant of Array.isArray(encObj) ? encObj : [encObj]) {
    try {
      const aes = await deriveAes(variant, key, ['decrypt']);
      return await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(variant.iv)}, aes, b64(variant.data));
    } catch (error) {
      if (error.name !== 'OperationError') throw error;
      lastError = error;
    }
  }
  throw lastError || new Error('No encrypted content available');
}
async function decryptJson(encObj, key) {
  return JSON.parse(dec.decode(await decryptBytes(encObj, key)));
}
function safeUrl(raw) {
  try {
    const url = new URL(String(raw || ''), window.location.href);
    return ['https:', 'mailto:'].includes(url.protocol) ? url.href : '#';
  } catch { return '#'; }
}
function fragmentKey() {
  const raw = location.hash.slice(1);
  if (!raw) return {};
  const params = new URLSearchParams(raw);
  if (params.get('k')) return {sku:params.get('s') || params.get('sku'), key:params.get('k')};
  const m = raw.match(/^([^/]+)\/(.+)$/);
  if (m) return {sku:decodeURIComponent(m[1]), key:decodeURIComponent(m[2])};
  return {key:decodeURIComponent(raw)};
}
function isMemberConfirmed() { return localStorage.getItem('memberConfirmed') === '1'; }
function setMemberConfirmed() { localStorage.setItem('memberConfirmed', '1'); }
function contentParts(content) {
  if (Array.isArray(content)) return {items:content, legacy:true};
  return {...content, items:content.items || [], legacy:false};
}
function renderHome(message) {
  const visible = skus.filter((s) => !s.hidden);
  app.innerHTML = (message ? `<div class="card"><p class="msg">${esc(message)}</p></div>` : '') + visible.map((s, i) => `
    <section class="card sku" data-sku="${esc(s.id)}">
      <div class="sku-head"><div><h2>${esc(s.title)}</h2><div class="slug">${esc(s.id)}</div></div><span class="pill">特典あり</span></div>
      <p class="lead">${esc(s.subtitle || '購入者向けの特典を受け取れます。')}</p>
      <div class="gate"><input type="password" inputmode="text" autocomplete="off" placeholder="特典キーを入力" aria-label="特典キー"><button class="btn" type="button">特典を開く</button></div>
      <p class="msg" hidden></p><div class="unlocked"></div>
    </section>`).join('');
  document.querySelectorAll('.sku').forEach((sec) => {
    const sku = skus.find((x) => x.id === sec.dataset.sku);
    const input = sec.querySelector('input');
    const run = () => unlock(sku, input.value.trim(), false);
    sec.querySelector('button').addEventListener('click', run);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
  });
}
function renderSelected(sku) {
  app.innerHTML = `<section class="card sku" data-sku="${esc(sku.id)}">
    <div class="sku-head"><div><h2>${esc(sku.title)}</h2><div class="slug">${esc(sku.id)}</div></div><span class="pill">リンク確認済み</span></div>
    <p class="lead">リンクから特典キーを読み取りました。復号しています…</p>
    <p class="msg" hidden></p><div class="unlocked"></div>
  </section>`;
  return document.querySelector('.sku');
}
function itemHtml(item, idx) {
  const locked = item.memberLocked && !isMemberConfirmed();
  const typeTag = item.type === 'encrypted-html' ? (locked ? '任意登録者向け' : 'ブラウザで開く') : '特典';
  return `<article class="item" data-idx="${idx}">
    <div class="item-top"><div><h3>${esc(item.name)}</h3><p class="desc">${esc(item.desc || '')}</p></div><span class="tag">${esc(typeTag)}</span></div>
    ${item.type === 'encrypted-html'
      ? `<div class="item-actions"><button type="button" class="btn asset-open">${locked ? '登録を確認して開く' : esc(item.cta || '開く')}</button></div>
         ${locked ? `<div class="confirm hidden">任意登録が済んでいる方向けの追加ガイドです。まだの方は下の「任意登録」から無料登録できます。<br><button type="button" class="btn secondary confirm-member">登録済みなので開く</button></div>` : ''}
         <div class="asset-viewer"></div>`
      : item.status === '準備中'
        ? `<div class="item-actions"><span class="small">準備中</span></div>`
        : `<div class="item-actions"><a class="btn" href="${esc(safeUrl(item.url))}" target="_blank" rel="noopener">開く</a></div>`}
  </article>`;
}
function blockHtml(kind, data) {
  if (!data) return '';
  const cls = kind === 'registration' ? 'member-box' : kind === 'review' ? 'review-box' : 'next-box';
  return `<div class="${cls}"><b>${esc(data.title || '')}</b><p>${esc(data.body || '')}</p>
    ${data.url ? `<a class="btn secondary" href="${esc(safeUrl(data.url))}" target="_blank" rel="noopener">${esc(data.cta || '開く')}</a>` : ''}
    ${kind === 'registration' ? ' <button type="button" class="btn quiet confirm-member-inline">登録しました</button>' : ''}
  </div>`;
}
function renderContent(sec, sku, content, key) {
  const c = contentParts(content);
  const unlocked = sec.querySelector('.unlocked');
  const gate = sec.querySelector('.gate');
  const msg = sec.querySelector('.msg');
  if (gate) gate.classList.add('hidden');
  msg.textContent = '特典を表示しています。';
  msg.className = 'msg ok';
  msg.hidden = false;
  unlocked.innerHTML = `
    ${c.lead ? `<p class="lead">${esc(c.lead)}</p>` : ''}
    ${c.notice ? `<div class="note-box">${esc(c.notice)}</div>` : ''}
    <div class="items">${c.items.map(itemHtml).join('')}</div>
    ${blockHtml('registration', c.registration)}
    ${blockHtml('review', c.review)}
    ${blockHtml('next', c.next)}
    ${c.legacy ? '' : '<p class="small">各特典はこのブラウザ内で復号して表示します。キーはサーバーへ送信されません。</p>'}`;
  unlocked.querySelectorAll('.asset-open').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const itemEl = btn.closest('.item');
      const item = c.items[+itemEl.dataset.idx];
      if (item.memberLocked && !isMemberConfirmed()) {
        itemEl.querySelector('.confirm')?.classList.toggle('hidden');
        return;
      }
      await openAsset(itemEl, item, key);
    });
  });
  unlocked.querySelectorAll('.confirm-member,.confirm-member-inline').forEach((btn) => {
    btn.addEventListener('click', () => { setMemberConfirmed(); renderContent(sec, sku, content, key); });
  });
}
async function openAsset(itemEl, item, key) {
  const btn = itemEl.querySelector('.asset-open');
  const host = itemEl.querySelector('.asset-viewer');
  btn.disabled = true;
  btn.textContent = '復号しています…';
  try {
    const res = await fetch(item.path, {cache:'no-store'});
    if (!res.ok) throw new Error('asset fetch failed');
    const encObj = await res.json();
    const plain = await decryptBytes(encObj, key);
    const blob = new Blob([plain], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    host.innerHTML = `<div class="viewerbar"><a href="${url}" target="_blank" rel="noopener">大きく開く</a><button type="button" class="btn quiet close-viewer">閉じる</button></div><iframe title="${esc(item.name)}" src="${url}"></iframe>`;
    host.querySelector('.close-viewer').addEventListener('click', () => { host.innerHTML = ''; });
    btn.textContent = '開きました';
  } catch (e) {
    btn.textContent = 'もう一度試す';
    host.innerHTML = '<p class="msg">特典を開けませんでした。通信状態を確認して、もう一度お試しください。</p>';
  } finally {
    btn.disabled = false;
  }
}
async function unlock(sku, key, auto) {
  if (!key) return;
  const sec = auto ? renderSelected(sku) : document.querySelector(`.sku[data-sku="${CSS.escape(sku.id)}"]`);
  const msg = sec.querySelector('.msg');
  msg.hidden = true;
  try {
    const content = await decryptJson(sku.enc, key);
    renderContent(sec, sku, content, key);
    sec.scrollIntoView({behavior:'smooth', block:'start'});
  } catch {
    msg.textContent = auto ? 'リンクの鍵で開けませんでした。購入者向け案内のリンクから開き直してください。' : 'キーが違います。購入者向け案内をご確認ください。';
    msg.className = 'msg';
    msg.hidden = false;
  }
}
async function init() {
  try {
    const res = await fetch('skus.json', {cache:'no-store'});
    skus = await res.json();
  } catch {
    app.innerHTML = '<div class="card"><p class="msg">特典情報を読み込めませんでした。時間をおいて開き直してください。</p></div>';
    return;
  }
  const frag = fragmentKey();
  if (frag.key) {
    const sku = skus.find((s) => s.id === frag.sku) || (frag.sku ? null : skus.find((s) => !s.hidden));
    if (sku) { unlock(sku, frag.key, true); return; }
  }
  renderHome();
}
window.addEventListener('hashchange', init);
init();
</script>
</body>
</html>
